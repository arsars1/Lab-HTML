<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Галерея Свистуна Арсенія Олександровича</title>
    <link rel="stylesheet" href="style(gallery).css">
</head>
<body>
    <h1>Галерея Свистуна Арсенія Олександровича</h1>

    <a id="index" href="index.html">Назад на головну</a>
    <br>

    <h2 id="images">Мої зображення</h2>

    <div class="gallery">
        <div>
            <h3 id="first-image">Зображення у цій папці</h3>
            <img src="640x480.svg" width="640" height="480" alt="Локальне зображення розміром 640 на 480 пікселів">
        </div>

        <div>
            <h3 id="second-image">Зображення у папці</h3>
            <img src="images/640x480.svg" width="640" height="480" alt="Зображення розміром 640 на 480 пікселів з папки images">
        </div>

        <div>
            <h3 id="online-image">Зображення онлайн</h3>
            <img src="https://placehold.co/1280x1024" width="1280" height="1024" alt="Онлайн зображення розміром 1280 на 1024 пікселів">
        </div>
    </div>

</body>
</html>
